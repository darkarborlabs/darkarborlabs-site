<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} | {{name}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{canonical}}">
  <link rel="stylesheet" href="{{root}}assets/site.css">
  <link rel="stylesheet" href="{{root}}assets/products.css">
</head>
<body style="--product: {{color}}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="app-header-inner">
      <span class="app-ident">
        <img src="{{root}}{{icon}}" alt="" width="36" height="36">
        <span>{{name}}</span>
      </span>
      <nav class="app-nav" aria-label="{{name}}">{{pagenav}}</nav>
    </div>
  </header>

  <main class="container" id="main">
    <header class="page-head">
      <h1>{{title}}</h1>
    </header>

    {{content}}
  </main>

  <footer>
    <div class="container">
      <p class="legal-notice">Published by Dark Arbor Labs LLC, a California limited liability company.</p>
      <p class="copyright">&copy; 2026 Dark Arbor Labs LLC &middot; All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
